plugins {
    id 'com.android.application'
}

def dreamSyncKeystore = System.getenv('DREAMSYNC_KEYSTORE')
def dreamSyncStorePassword = System.getenv('DREAMSYNC_STORE_PASSWORD')
def dreamSyncKeyPassword = System.getenv('DREAMSYNC_KEY_PASSWORD')
def dreamSyncReleaseSigningReady = dreamSyncKeystore
        && file(dreamSyncKeystore).isFile()
        && dreamSyncStorePassword
        && dreamSyncKeyPassword
def samsungSensorAar = file('libs/samsung-health-sensor-api.aar')
def samsungSensorAarSha256 = '893cd5d6564db0f304bf511a555c1d65ca6bccc8475fc979ff1d71d50680344c'

android {
    namespace 'com.remote.DreamSync'
    compileSdk 36

    defaultConfig {
        applicationId 'com.remote.DreamSync'
        minSdk 30
        targetSdk 36
        versionCode 64
        versionName '1.3.15-test'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas"]
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas")
    }

    if (dreamSyncReleaseSigningReady) {
        signingConfigs {
            release {
                storeFile file(dreamSyncKeystore)
                storePassword dreamSyncStorePassword
                keyAlias System.getenv('DREAMSYNC_KEY_ALIAS') ?: 'dreamsync-upload'
                keyPassword dreamSyncKeyPassword
            }
        }
        buildTypes {
            release {
                signingConfig signingConfigs.release
            }
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    boolean releaseRequested = graph.allTasks.any {
        it.project == project && it.name in ['bundleRelease', 'assembleRelease']
    }
    if (releaseRequested && !dreamSyncReleaseSigningReady) {
        throw new GradleException('DreamSync release signing is required. Set the protected DREAMSYNC signing variables.')
    }
}

dependencies {
    implementation project(':shared')
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.health:health-services-client:1.1.0-rc02'
    implementation 'com.google.guava:guava:32.0.1-android'
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
    implementation 'androidx.wear:wear-remote-interactions:1.2.0'
    implementation 'androidx.room:room-runtime:2.8.4'
    implementation 'androidx.work:work-runtime:2.11.2'
    annotationProcessor 'androidx.room:room-compiler:2.8.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.room:room-testing:2.8.4'
    if (samsungSensorAar.exists()) {
        implementation files(samsungSensorAar)
    }
}

def verifySamsungSensorSdk = tasks.register('verifySamsungSensorSdk') {
    group = 'verification'
    description = 'Verifies the official Samsung Health Sensor SDK v1.4.1 AAR and required API contract.'
    doLast {
        def aar = samsungSensorAar
        if (!aar.isFile() || aar.length() == 0L) {
            throw new GradleException(
                    'Official Samsung AAR missing: wear/libs/samsung-health-sensor-api.aar. ' +
                    'Download it while signed in at Samsung Developer; never use an unofficial copy.')
        }

        def digest = java.security.MessageDigest.getInstance('SHA-256')
        aar.withInputStream { input ->
            byte[] buffer = new byte[8192]
            int count
            while ((count = input.read(buffer)) > 0) {
                digest.update(buffer, 0, count)
            }
        }
        def actualSha256 = digest.digest().collect { String.format('%02x', it) }.join()
        if (actualSha256 != samsungSensorAarSha256) {
            throw new GradleException(
                    "Unexpected Samsung SDK AAR checksum. Expected ${samsungSensorAarSha256}, got ${actualSha256}.")
        }

        def requiredClasses = [
                'com/samsung/android/service/health/tracking/HealthTrackingService.class',
                'com/samsung/android/service/health/tracking/HealthTracker.class',
                'com/samsung/android/service/health/tracking/ConnectionListener.class',
                'com/samsung/android/service/health/tracking/data/HealthTrackerType.class',
                'com/samsung/android/service/health/tracking/data/PpgType.class',
                'com/samsung/android/service/health/tracking/data/ValueKey$AccelerometerSet.class',
                'com/samsung/android/service/health/tracking/data/ValueKey$HeartRateSet.class'
        ] as Set
        def foundClasses = [] as Set
        def outerZip = new java.util.zip.ZipFile(aar)
        try {
            def classesEntry = outerZip.getEntry('classes.jar')
            if (classesEntry == null) {
                throw new GradleException('Samsung SDK AAR does not contain classes.jar.')
            }
            def nestedZip = new java.util.zip.ZipInputStream(outerZip.getInputStream(classesEntry))
            try {
                def entry
                while ((entry = nestedZip.nextEntry) != null) {
                    if (requiredClasses.contains(entry.name)) {
                        foundClasses.add(entry.name)
                    }
                }
            } finally {
                nestedZip.close()
            }
        } finally {
            outerZip.close()
        }
        def missingClasses = requiredClasses - foundClasses
        if (!missingClasses.isEmpty()) {
            throw new GradleException("Samsung SDK API contract is incomplete. Missing: ${missingClasses.sort().join(', ')}")
        }

        println "Official Samsung Health Sensor SDK v1.4.1 verified: ${aar.name} (${actualSha256})"
    }
}

tasks.configureEach { candidate ->
    if (candidate.name in ['preReleaseBuild', 'assembleRelease', 'bundleRelease']) {
        candidate.dependsOn(verifySamsungSensorSdk)
    }
}
