plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nathanw.somnicue'
    compileSdk 36

    defaultConfig {
        applicationId 'com.nathanw.somnicue'
        minSdk 31
        targetSdk 36
        versionCode 1
        versionName '0.1.0-nightly'
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas"]
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    def dreamSyncKeystore = System.getenv('DREAMSYNC_KEYSTORE')
    if (dreamSyncKeystore) {
        signingConfigs {
            release {
                storeFile file(dreamSyncKeystore)
                storePassword System.getenv('DREAMSYNC_STORE_PASSWORD')
                keyAlias System.getenv('DREAMSYNC_KEY_ALIAS') ?: 'dreamsync-upload'
                keyPassword System.getenv('DREAMSYNC_KEY_PASSWORD')
            }
        }
        buildTypes {
            release {
                signingConfig signingConfigs.release
            }
        }
    }

    sourceSets {
        main {
            assets.srcDirs += layout.buildDirectory.dir('generated/wearApk')
        }
    }
}

// Bundle the wear APK as an asset so the phone app can deploy it to the watch
// over Wi-Fi ADB (see WatchDeployer).
tasks.register('copyWearApk', Copy) {
    dependsOn ':wear:assembleDebug'
    from project(':wear').layout.buildDirectory.file('outputs/apk/debug/wear-debug.apk')
    into layout.buildDirectory.dir('generated/wearApk')
    rename { 'dreamsync-wear.apk' }
}

tasks.named('preBuild').configure {
    dependsOn 'copyWearApk'
}

dependencies {
    implementation project(':shared')
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
    implementation 'androidx.wear:wear-remote-interactions:1.2.0'
    implementation 'androidx.room:room-runtime:2.8.4'
    annotationProcessor 'androidx.room:room-compiler:2.8.4'
    testImplementation 'junit:junit:4.13.2'
    implementation('dev.mobile:dadb:1.2.9') {
        // dadb's POM leaks JUnit as a runtime dependency; keep it out of the APK.
        exclude group: 'org.junit'
        exclude group: 'org.junit.jupiter'
        exclude group: 'org.junit.platform'
    }
}
