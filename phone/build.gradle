plugins {
    id 'com.android.application'
}

def dreamSyncKeystore = System.getenv('DREAMSYNC_KEYSTORE')
def dreamSyncStorePassword = System.getenv('DREAMSYNC_STORE_PASSWORD')
def dreamSyncKeyPassword = System.getenv('DREAMSYNC_KEY_PASSWORD')
def dreamSyncReleaseSigningReady = dreamSyncKeystore
        && file(dreamSyncKeystore).isFile()
        && dreamSyncStorePassword
        && dreamSyncKeyPassword

android {
    namespace 'com.remote.DreamSync'
    compileSdk 36

    defaultConfig {
        applicationId 'com.remote.DreamSync'
        minSdk 26
        targetSdk 36
        versionCode 71
        versionName '1.3.19-test'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas"]
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas")
    }

    signingConfigs {
        if (dreamSyncReleaseSigningReady) {
            release {
                storeFile file(dreamSyncKeystore)
                storePassword dreamSyncStorePassword
                keyAlias System.getenv('DREAMSYNC_KEY_ALIAS') ?: 'dreamsync-upload'
                keyPassword dreamSyncKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-dev'
            resValue 'string', 'app_name', 'DreamSync Dev'
        }
        release {
            if (dreamSyncReleaseSigningReady) {
                signingConfig signingConfigs.release
            }
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    boolean releaseRequested = graph.allTasks.any {
        it.project == project && it.name in ['bundleRelease', 'assembleRelease']
    }
    if (releaseRequested && !dreamSyncReleaseSigningReady) {
        throw new GradleException('DreamSync release signing is required. Set the protected DREAMSYNC signing variables.')
    }
}

dependencies {
    implementation project(':shared')
    implementation 'androidx.core:core:1.12.0'
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
    implementation 'androidx.wear:wear-remote-interactions:1.2.0'
    implementation 'androidx.room:room-runtime:2.8.4'
    annotationProcessor 'androidx.room:room-compiler:2.8.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.room:room-testing:2.8.4'
}
