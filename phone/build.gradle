plugins {
    id 'com.android.application'
}

android {
    namespace 'com.remote.DreamSync'
    compileSdk 36

    defaultConfig {
        applicationId 'com.remote.DreamSync'
        minSdk 26
        targetSdk 36
        versionCode 33
        versionName '1.3.0-test'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas"]
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas")
    }

    def dreamSyncKeystore = System.getenv('DREAMSYNC_KEYSTORE')
    if (dreamSyncKeystore) {
        signingConfigs {
            release {
                storeFile file(dreamSyncKeystore)
                storePassword System.getenv('DREAMSYNC_STORE_PASSWORD')
                keyAlias System.getenv('DREAMSYNC_KEY_ALIAS') ?: 'dreamsync-upload'
                keyPassword System.getenv('DREAMSYNC_KEY_PASSWORD')
            }
        }
        buildTypes {
            release {
                signingConfig signingConfigs.release
            }
        }
    }

}

dependencies {
    implementation project(':shared')
    implementation 'androidx.core:core:1.12.0'
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
    implementation 'androidx.wear:wear-remote-interactions:1.2.0'
    implementation 'androidx.room:room-runtime:2.8.4'
    annotationProcessor 'androidx.room:room-compiler:2.8.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.room:room-testing:2.8.4'
}
